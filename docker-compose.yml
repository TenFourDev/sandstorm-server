    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - ./server-content:/home/steam/server
      - ./server-saved-vanilla-arcade:/home/steam/server/Insurgency/Saved
      - ./config-inis/EngineVanilla.ini:/home/steam/server/Insurgency/Saved/Config/LinuxServer/_Engine.ini
      - ./config-inis/GameVanillaArcade.ini:/home/steam/server/Insurgency/Saved/Config/LinuxServer/_Game.ini
      - ./config-txts:/home/steam/server/Insurgency/Config/Server
      - ./start_vanilla_arcade.sh:/home/steam/server/start.sh
  sandstorm-restarter:
    image: docker:cli
    container_name: sandstorm-restarter
    restart: unless-stopped
    volumes: ["/var/run/docker.sock:/var/run/docker.sock"]
    environment:
      RESTART_TIME: 20:30
    entrypoint: ["/bin/sh","-c"]
    command:
      - |
        echo "Server will restart at $${RESTART_TIME} UTC time every day."
        while true; do
          echo "Current time: $$(date +'%H:%M')"
          if [ "$$(date +'%H:%M')" = "$${RESTART_TIME}" ]; then
            echo "Restarting containers..."
            docker restart sandstorm-vanilla
            docker restart sandstorm-vanilla-easy
            docker restart sandstorm-vanilla-arcade
          fi
          sleep 60
        done