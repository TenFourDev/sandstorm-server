      context: .
      dockerfile: Dockerfile
    container_name: sandstorm-vanilla
    network_mode: host
    security_opt:
      - seccomp:unconfined
      - systempaths=unconfined
    cap_add:
      - SYS_NICE
    restart: unless-stopped
    env_file:
      - .env
    volumes:
