    volumes:
      - ./server-content:/home/steam/server
      - ./server-saved-zombie-frenzy:/home/steam/server/Insurgency/Saved
      - ./mod.io:/home/steam/mod.io
      - ./config-inis/EngineZombieFrenzy.ini:/home/steam/server/Insurgency/Saved/Config/LinuxServer/_Engine.ini
      - ./config-inis/GameZombieFrenzy.ini:/home/steam/server/Insurgency/Saved/Config/LinuxServer/_Game.ini
      - ./config-txts:/home/steam/server/Insurgency/Config/Server
      - ./start_zombie_frenzy.sh:/home/steam/server/start.sh
  sandstorm-vanilla:
