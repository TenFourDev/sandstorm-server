services:
  sandstorm:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: sandstorm
    network_mode: host
    security_opt:
      - seccomp:unconfined
      - systempaths=unconfined
    cap_add:
      - SYS_NICE
    restart: unless-stopped
    env_file:
      - .env
    # uncomment environment section to install / update the game server on container start
    # when updating or installing the game server, run only one container to avoid conflicts
    # e.g. docker compose up sandstorm
    # environment: 
    #   - RUN_APP_UPDATE=true
    volumes:
      - ./server-content:/home/steam/server
      - ./server-saved:/home/steam/server/Insurgency/Saved
      - ./mod.io:/home/steam/mod.io
      - ./config-inis/EngineCheckpoint.ini:/home/steam/server/Insurgency/Saved/Config/LinuxServer/_Engine.ini
      - ./config-inis/GameCheckpoint.ini:/home/steam/server/Insurgency/Saved/Config/LinuxServer/_Game.ini
      - ./config-txts:/home/steam/server/Insurgency/Config/Server
      - ./start.sh:/home/steam/server/start.sh
  sandstorm-zombie:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: sandstorm-zombie
    network_mode: host
