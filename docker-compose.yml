      - ./server-saved-vanilla:/home/steam/server/Insurgency/Saved
      - ./config-inis/EngineVanilla.ini:/home/steam/server/Insurgency/Saved/Config/LinuxServer/_Engine.ini
      - ./config-inis/GameVanilla.ini:/home/steam/server/Insurgency/Saved/Config/LinuxServer/_Game.ini
      - ./config-txts:/home/steam/server/Insurgency/Config/Server
      - ./start_vanilla.sh:/home/steam/server/start.sh
  sandstorm-vanilla-easy:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: sandstorm-vanilla-easy
    network_mode: host
