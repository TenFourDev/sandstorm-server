      - ./server-saved-zombie:/home/steam/server/Insurgency/Saved
      - ./mod.io:/home/steam/mod.io
      - ./config-inis/EngineZombie.ini:/home/steam/server/Insurgency/Saved/Config/LinuxServer/_Engine.ini
      - ./config-inis/GameZombie.ini:/home/steam/server/Insurgency/Saved/Config/LinuxServer/_Game.ini
      - ./config-txts:/home/steam/server/Insurgency/Config/Server
      - ./start_zombie.sh:/home/steam/server/start.sh
